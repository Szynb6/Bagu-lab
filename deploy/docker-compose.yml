services:
  bagu-api:
    image: eclipse-temurin:17-jre-alpine
    container_name: bagu-api
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "exec java -Xms192m -Xmx384m -XX:MaxMetaspaceSize=160m
      -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom
      -jar /app/app.jar"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-bagu_db}
      DB_USER: ${DB_USER:-bagu_user}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-2}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-bagu-images}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      BAGU_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      BAGU_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - ./app.jar:/app/app.jar:ro
    networks:
      - ragent-local_default
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 30s
      timeout: 5s
      retries: 3

  bagu-web:
    image: nginx:1.27-alpine
    container_name: bagu-web
    restart: unless-stopped
    ports:
      - "${BAGU_WEB_PORT:-8088}:80"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - bagu-api
    networks:
      - ragent-local_default
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ragent-local_default:
    external: true
