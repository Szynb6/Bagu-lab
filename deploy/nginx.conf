server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS，支持后端容器动态解析与重启重连
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Nginx 自身健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 后端 REST API 反向代理
    location /api/ {
        set $api_upstream http://bagu-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 102 张高清原理图反向代理到 RustFS 公开读桶（30 天强缓存）
    location /images/ {
        proxy_pass http://ragent-local-rustfs-1:9000/bagu-images/;
        proxy_http_version 1.1;
        proxy_set_header Host ragent-local-rustfs-1:9000;
        proxy_buffering on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 前端打包静态资源长缓存（带内容 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Vue Router History 模式兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
